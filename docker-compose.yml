version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BACKEND_PORT=8000
    volumes:
      - ./contracts:/app/contracts
      - ./data:/app/data
      - ./ai:/app/ai

  frontend:
    build:
      context: apps/frontend
    ports:
      - "3000:3000"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
